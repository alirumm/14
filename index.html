<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Settings">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/commons/6/67/iOS_Settings_icon.png">
  <title>Settings</title>
  <style>
    :root {
      --bg: #000000;
      --card-bg: #1c1c1e;
      --text: #ffffff;
      --text-sec: #8e8e93;
      --blue: #0a84ff;
      --green: #30d158;
      --orange: #ff9f0a;
      --yellow: #ffd60a;
      --purple: #bf5af2;
      --separator: #2c2c2e;
      --safe-top: env(safe-area-inset-top, 44px);
      --safe-bottom: env(safe-area-inset-bottom, 34px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
      touch-action: manipulation;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      width: 100vw;
      height: 100vh;
    }

    #app {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    .page {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      overflow-y: auto;
      padding-top: calc(var(--safe-top) + 2px);
      padding-bottom: calc(var(--safe-bottom) + 30px);
      display: none;
    }

    .page.active {
      display: block;
    }

    /* Fixed Native iOS Status Bar */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      height: 44px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.2px;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
    }

    /* Navigation Bar */
    .nav-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 16px;
      position: sticky;
      top: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 10;
    }

    .nav-back {
      color: var(--blue);
      font-size: 17px;
      display: flex;
      align-items: center;
      cursor: pointer;
    }

    .nav-back::before {
      content: '‹';
      font-size: 30px;
      margin-right: 4px;
      margin-top: -3px;
    }

    .nav-title {
      font-size: 17px;
      font-weight: 600;
      text-align: center;
      flex-grow: 1;
    }

    .large-title {
      font-size: 34px;
      font-weight: 700;
      padding: 8px 16px 12px 16px;
      letter-spacing: -0.5px;
    }

    /* Search Box */
    .search-container { padding: 0 16px 10px 16px; }
    .search-box {
      background: #1c1c1e;
      border-radius: 10px;
      display: flex;
      align-items: center;
      padding: 8px 12px;
      color: var(--text-sec);
      font-size: 16px;
    }
    .search-box span { margin-right: 8px; }

    /* Cards & Lists */
    .section {
      margin: 0 16px 20px 16px;
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
    }

    .section-title {
      font-size: 13px;
      color: var(--text-sec);
      text-transform: uppercase;
      margin: 16px 16px 6px 16px;
    }

    .row {
      display: flex;
      align-items: center;
      padding: 10px 16px;
      min-height: 44px;
      border-bottom: 0.5px solid var(--separator);
      font-size: 17px;
      cursor: pointer;
    }
    .row:last-child { border-bottom: none; }

    .row-icon {
      width: 29px;
      height: 29px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 14px;
      font-size: 16px;
      color: white;
    }

    .row-label { flex: 1; font-weight: 400; }
    .row-value { color: var(--text-sec); font-size: 17px; margin-right: 6px; }
    .row-arrow { color: #545458; font-size: 18px; }

    /* Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 51px;
      height: 31px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
